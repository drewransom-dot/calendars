name: Build and publish calendar feeds
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - events.json
      - sources.json
      - scripts/**
      - .github/workflows/publish.yml
permissions:
  contents: write
concurrency:
  group: creative-edit-publishing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and validate organizer-listed events
        run: python scripts/discover_events.py
      - name: Generate rolling calendar feeds
        run: python scripts/build_calendars.py
      - name: Commit updated database, audit, and feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json discovery-report.json docs/*.ics
          git diff --cached --quiet || (git commit -m "Discover events and refresh calendar feeds" && git pull --rebase origin main && git push origin HEAD:main)
