name: Build and publish calendar feeds
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - events.json
      - scripts/build_calendars.py
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate rolling calendar feeds
        run: python scripts/build_calendars.py
      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.ics
          git diff --cached --quiet || (git commit -m "Refresh calendar feeds" && git pull --rebase origin main && git push origin HEAD:main)
